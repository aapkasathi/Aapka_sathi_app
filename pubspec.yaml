name: aapka_sathi
description: Aapka Sathi - Service Platform
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # The default icon pack
  cupertino_icons: ^1.0.6
  # packages
  file_picker: ^10.3.8
  url_launcher: ^6.2.1
  intl: ^0.20.2
  image_picker: ^1.0.4
  supabase_flutter: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # You need this package for the icon configuration below to work
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/ 

# Configuration for the app icon generator
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21